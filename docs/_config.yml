title: UnitVectorY Labs
description: "Documentation and guides from @UnitVectorY-Labs"

remote_theme: UnitVectorY-Labs/uvy-docs-theme@v0.2.0
plugins:
  - jekyll-remote-theme

callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

mermaid:
  # Version of mermaid library
  # Pick an available version from https://cdn.jsdelivr.net/npm/mermaid/
  version: "12.3.0" # MERMAIDVERSION

# External navigation links
nav_external_links:
  - title: uvy-labs-guide on GitHub
    url: https://github.com/UnitVectorY-Labs/uvy-labs-guide

# Footer "Edit this page on GitHub" link text
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub."
gh_edit_repository: "https://github.com/UnitVectorY-Labs/uvy-labs-guide"
gh_edit_branch: "main"
gh_edit_source: "docs"
gh_edit_view_mode: "tree"

# Repository-specific settings preserved from the previous configuration.
# These are not yet expressible as gitrepoforge config keys, so this file
# intentionally drifts from the docs/_config.yml template. See the
# uvy-labs-guide gitrepoforge retrofit PR description for follow-ups.
baseurl: /

# Collections
collections:
  bestpractices:
    output: true
    permalink: /:collection/:path/
  uvyutilities:
    output: true
    permalink: /:collection/:path/
  javadevelopment:
    output: true
    permalink: /:collection/:path/
  tofudevelopment:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /:collection/:path/
just_the_docs:
  collections:
    bestpractices:
      name: Best Practices
      nav_fold: false
    uvyutilities:
      name: UVY Utilities
      nav_fold: false
    javadevelopment:
      name: Java Development
      nav_fold: false
    tofudevelopment:
      name: Tofu Development
      nav_fold: false
    projects:
      name: Projects
      nav_fold: false
